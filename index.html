<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Колесо Фортуны</title>
  <style>
    :root {
      --bg-1: #fff6dd;
      --bg-2: #ffd5a8;
      --panel: rgba(255, 252, 244, 0.9);
      --panel-border: rgba(113, 73, 33, 0.14);
      --text: #2f2217;
      --muted: #75573d;
      --accent: #d9481f;
      --accent-2: #ffb703;
      --shadow: 0 24px 60px rgba(95, 49, 12, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 183, 3, 0.35), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 360px minmax(320px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel,
    .wheel-panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      border: 1px solid rgba(92, 57, 24, 0.15);
      border-radius: 18px;
      padding: 16px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    textarea:focus {
      outline: 3px solid rgba(255, 183, 3, 0.35);
      border-color: rgba(217, 72, 31, 0.35);
    }

    .hint {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), #ff6b35);
      box-shadow: 0 14px 28px rgba(217, 72, 31, 0.26);
    }

    .secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(92, 57, 24, 0.12);
    }

    .wheel-panel {
      padding: 24px;
      min-height: 720px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      max-width: 680px;
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 44px solid var(--accent);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.18));
      position: relative;
      z-index: 3;
      margin-bottom: -10px;
    }

    .wheel-wrap {
      position: relative;
      width: min(72vw, 560px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      border: 14px solid #fff2cf;
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.38),
        0 28px 50px rgba(72, 33, 4, 0.26);
      transition: transform 5.8s cubic-bezier(0.12, 0.95, 0.16, 1);
      overflow: hidden;
      background: #f5deb3;
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fff8df, #ffbf69 62%, #d9481f 100%);
      box-shadow: 0 10px 18px rgba(73, 34, 3, 0.24);
      z-index: 2;
    }

    .slice-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      transform-origin: 0 0;
      font-weight: 800;
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      color: rgba(47, 34, 23, 0.92);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      text-align: right;
      padding-right: 28px;
      z-index: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner {
      width: min(100%, 520px);
      padding: 20px 22px;
      border-radius: 22px;
      text-align: center;
      background: rgba(255, 249, 235, 0.92);
      border: 1px solid rgba(217, 72, 31, 0.16);
      box-shadow: 0 16px 30px rgba(95, 49, 12, 0.12);
    }

    .winner-label {
      margin: 0 0 10px;
      font-size: 0.84rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .winner-name {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      line-height: 1.05;
      min-height: 1.1em;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(92, 57, 24, 0.1);
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .wheel-panel {
        min-height: auto;
      }

      .wheel-wrap {
        width: min(88vw, 520px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Колесо<br />Фортуны</h1>
      <p class="lead">
        Вставь список участников и крути колесо. Один сегмент, одно имя, один победитель.
      </p>

      <label for="names">Участники</label>
      <textarea id="names" spellcheck="false">Стас
Саша К.
Сережа
Саша В.
Глеб
Толя
Леша
Денис
Миша
Юра
Валя
Паша</textarea>
      <p class="hint">
        Пиши по одному имени в строке. Можно вставить и через запятую, лишние пробелы будут убраны.
      </p>

      <div class="actions">
        <button class="primary" id="spinBtn">Крутить колесо</button>
        <button class="secondary" id="shuffleBtn" type="button">Перемешать список</button>
      </div>
    </section>

    <section class="wheel-panel">
      <div class="stage">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel-wrap">
          <div class="wheel" id="wheel" aria-label="Колесо фортуны"></div>
        </div>

        <div class="winner">
          <p class="winner-label">Победитель</p>
          <p class="winner-name" id="winnerName">Нажми «Крутить колесо»</p>
        </div>

        <div class="stats">
          <div class="badge">Сегментов: <span id="countValue">0</span></div>
          <div class="badge">Статус: <span id="statusValue">готово</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const textarea = document.getElementById("names");
    const wheel = document.getElementById("wheel");
    const spinBtn = document.getElementById("spinBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const winnerName = document.getElementById("winnerName");
    const countValue = document.getElementById("countValue");
    const statusValue = document.getElementById("statusValue");

    let currentNames = [];
    let currentRotation = 0;
    let spinTimeout = null;
    let spinning = false;
    const STORAGE_KEY = "fortune-wheel:names";

    const palette = [
      "#ffbe0b",
      "#fb5607",
      "#ff8fab",
      "#90be6d",
      "#43aa8b",
      "#4d96ff",
      "#b388eb",
      "#ffd166",
      "#f28482",
      "#84a59d"
    ];

    function parseNames(value) {
      return value
        .split(/\n|,/g)
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function saveNames(value) {
      try {
        localStorage.setItem(STORAGE_KEY, value);
      } catch (error) {
        console.warn("Не удалось сохранить список в localStorage", error);
      }
    }

    function loadNames() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        console.warn("Не удалось прочитать список из localStorage", error);
        return null;
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderWheel() {
      currentNames = parseNames(textarea.value);
      wheel.innerHTML = "";

      const count = currentNames.length;
      countValue.textContent = count;

      if (count < 2) {
        wheel.style.background = "radial-gradient(circle at 30% 30%, #fff5d7, #ffd7a1)";
        winnerName.textContent = "Нужно минимум 2 имени";
        statusValue.textContent = "ожидание";
        return;
      }

      const step = 360 / count;
      const gradientParts = currentNames.map((_, index) => {
        const start = index * step;
        const end = start + step;
        return `${palette[index % palette.length]} ${start}deg ${end}deg`;
      });

      wheel.style.background = `conic-gradient(${gradientParts.join(", ")})`;

      currentNames.forEach((name, index) => {
        const label = document.createElement("div");
        label.className = "slice-label";
        label.textContent = name;

        const angle = index * step + step / 2 - 90;
        label.style.transform = `rotate(${angle}deg) translate(18px, -50%)`;
        wheel.appendChild(label);
      });

      if (!spinning) {
        winnerName.textContent = "Нажми «Крутить колесо»";
        statusValue.textContent = "готово";
      }
    }

    function getWinner(rotation, names) {
      const count = names.length;
      const step = 360 / count;
      const normalized = ((rotation % 360) + 360) % 360;
      const pointerAngle = (360 - normalized) % 360;
      const index = Math.floor(pointerAngle / step) % count;
      return names[index];
    }

    function spinWheel() {
      const names = parseNames(textarea.value);
      if (names.length < 2 || spinning) {
        renderWheel();
        return;
      }

      spinning = true;
      currentNames = names;
      statusValue.textContent = "крутится";
      winnerName.textContent = "Выбираем...";
      spinBtn.disabled = true;
      shuffleBtn.disabled = true;

      const extraTurns = 6 + Math.floor(Math.random() * 5);
      const randomOffset = Math.random() * 360;
      currentRotation += extraTurns * 360 + randomOffset;

      wheel.style.transform = `rotate(${currentRotation}deg)`;

      clearTimeout(spinTimeout);
      spinTimeout = setTimeout(() => {
        const winner = getWinner(currentRotation, currentNames);
        winnerName.textContent = winner;
        statusValue.textContent = "остановлено";
        spinning = false;
        spinBtn.disabled = false;
        shuffleBtn.disabled = false;
      }, 5900);
    }

    textarea.addEventListener("input", () => {
      saveNames(textarea.value);
      renderWheel();
    });
    spinBtn.addEventListener("click", spinWheel);
    shuffleBtn.addEventListener("click", () => {
      const names = parseNames(textarea.value);
      textarea.value = shuffle(names).join("\n");
      saveNames(textarea.value);
      renderWheel();
    });

    const savedNames = loadNames();
    if (savedNames && savedNames.trim()) {
      textarea.value = savedNames;
    } else {
      saveNames(textarea.value);
    }

    renderWheel();
  </script>
</body>
</html>
