<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Колесо Фортуны</title>
  <style>
    :root {
      --bg-1: #fff6dd;
      --bg-2: #ffd5a8;
      --panel: rgba(255, 252, 244, 0.9);
      --panel-border: rgba(113, 73, 33, 0.14);
      --text: #2f2217;
      --muted: #75573d;
      --accent: #d9481f;
      --accent-2: #ffb703;
      --shadow: 0 24px 60px rgba(95, 49, 12, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 183, 3, 0.35), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 360px minmax(320px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel,
    .wheel-panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      border: 1px solid rgba(92, 57, 24, 0.15);
      border-radius: 18px;
      padding: 16px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    textarea:focus {
      outline: 3px solid rgba(255, 183, 3, 0.35);
      border-color: rgba(217, 72, 31, 0.35);
    }

    .hint {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), #ff6b35);
      box-shadow: 0 14px 28px rgba(217, 72, 31, 0.26);
    }

    .secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(92, 57, 24, 0.12);
    }

    .wheel-panel {
      padding: 24px;
      min-height: 720px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      max-width: 680px;
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .pointer {
      position: relative;
      width: 54px;
      height: 118px;
      z-index: 3;
      margin-bottom: -58px;
      display: grid;
      place-items: start center;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.16));
    }

    .pointer-flag {
      position: relative;
      width: 38px;
      height: 96px;
      transform-origin: 50% 6px;
      transform: rotate(7deg);
    }

    .pointer-flag::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 0;
      width: 6px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff5d6, #eab676);
      box-shadow: inset 0 -1px 0 rgba(82, 45, 10, 0.2);
    }

    .pointer-flag::after {
      content: "";
      position: absolute;
      left: 0;
      top: 30px;
      width: 38px;
      height: 66px;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-radius: 4px;
      background: linear-gradient(180deg, #ff7849, #c93516);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 4px 10px rgba(112, 34, 10, 0.18);
    }

    .pointer-hub {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff6dc, #ffbe0b 58%, #d9481f 100%);
      box-shadow: 0 2px 6px rgba(61, 27, 3, 0.24);
    }

    .pointer-base {
      position: absolute;
      top: 28px;
      left: 50%;
      width: 46px;
      height: 12px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #fff1d4, #efc07d);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 5px 10px rgba(72, 33, 4, 0.12);
    }

    .wheel-wrap {
      position: relative;
      width: min(72vw, 560px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .rotor {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transform: rotate(0deg);
    }

    .winner-flash {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
      mix-blend-mode: screen;
      transition: opacity 240ms ease;
    }

    .winner-flash.is-visible {
      opacity: 1;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      border: 14px solid #fff2cf;
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.38),
        0 28px 50px rgba(72, 33, 4, 0.26);
      overflow: hidden;
      background: #f5deb3;
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fff8df, #ffbf69 62%, #d9481f 100%);
      box-shadow: 0 10px 18px rgba(73, 34, 3, 0.24);
      z-index: 2;
    }

    .peg-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }

    .peg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff9e1 0%, #f3d38f 42%, #b87421 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 2px 5px rgba(79, 35, 3, 0.22);
      transform-origin: center center;
    }

    .peg::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      width: 5px;
      height: 20px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.08));
      opacity: 0.7;
    }

    .slice-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      transform-origin: 0 0;
      font-weight: 800;
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      color: rgba(47, 34, 23, 0.92);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      text-align: right;
      padding-right: 28px;
      z-index: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner {
      width: min(100%, 520px);
      padding: 20px 22px;
      border-radius: 22px;
      text-align: center;
      background: rgba(255, 249, 235, 0.92);
      border: 1px solid rgba(217, 72, 31, 0.16);
      box-shadow: 0 16px 30px rgba(95, 49, 12, 0.12);
      position: relative;
      overflow: hidden;
    }

    .winner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
      transform: translateX(-130%);
      opacity: 0;
    }

    .winner.is-celebrating {
      border-color: rgba(255, 183, 3, 0.45);
      box-shadow:
        0 20px 40px rgba(95, 49, 12, 0.14),
        0 0 0 6px rgba(255, 183, 3, 0.12);
      animation: winner-pop 620ms cubic-bezier(0.2, 0.92, 0.28, 1);
    }

    .winner.is-celebrating::before {
      opacity: 1;
      animation: winner-shine 760ms ease;
    }

    .winner-label {
      margin: 0 0 10px;
      font-size: 0.84rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .winner-name {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      line-height: 1.05;
      min-height: 1.1em;
      position: relative;
      z-index: 1;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(92, 57, 24, 0.1);
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .confetti-piece {
      position: absolute;
      top: -8%;
      width: 10px;
      height: 18px;
      border-radius: 2px;
      opacity: 0.92;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 0.95;
      }
      100% {
        transform: translate3d(var(--drift-x), 120vh, 0) rotate(var(--spin-turn));
        opacity: 0;
      }
    }

    @keyframes winner-pop {
      0% {
        transform: scale(0.98);
      }
      45% {
        transform: scale(1.03);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes winner-shine {
      0% {
        transform: translateX(-130%);
      }
      100% {
        transform: translateX(130%);
      }
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .wheel-panel {
        min-height: auto;
      }

      .wheel-wrap {
        width: min(88vw, 520px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Колесо<br />Фортуны</h1>
      <p class="lead">
        Вставь любой список и крути колесо. Один сегмент, одно значение, один победитель.
      </p>

      <label for="names">Список</label>
      <textarea id="names" spellcheck="false">Стас
Саша К.
Сережа
Саша В.
Глеб
Толя
Леша
Денис
Миша
Юра
Валя
Паша</textarea>
      <p class="hint">
        Пиши по одному значению в строке. Можно вставить и через запятую, лишние пробелы будут убраны.
      </p>

      <div class="actions">
        <button class="primary" id="spinBtn">Крутить колесо</button>
        <button class="secondary" id="shuffleBtn" type="button">Перемешать список</button>
      </div>
    </section>

    <section class="wheel-panel">
      <div class="stage">
        <div class="pointer" id="pointer" aria-hidden="true">
          <div class="pointer-flag"></div>
          <div class="pointer-hub"></div>
          <div class="pointer-base"></div>
        </div>
        <div class="wheel-wrap">
          <div class="rotor" id="rotor">
            <div class="wheel" id="wheel" aria-label="Колесо фортуны"></div>
            <div class="peg-ring" id="pegRing" aria-hidden="true"></div>
            <div class="winner-flash" id="winnerFlash" aria-hidden="true"></div>
          </div>
        </div>

        <div class="winner" id="winnerCard">
          <p class="winner-label">Победитель</p>
          <p class="winner-name" id="winnerName">Нажми «Крутить колесо»</p>
        </div>

        <div class="stats">
          <div class="badge">Сегментов: <span id="countValue">0</span></div>
          <div class="badge">Статус: <span id="statusValue">готово</span></div>
        </div>
      </div>
      <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const textarea = document.getElementById("names");
    const rotor = document.getElementById("rotor");
    const wheel = document.getElementById("wheel");
    const pointerFlag = document.querySelector(".pointer-flag");
    const pegRing = document.getElementById("pegRing");
    const winnerFlash = document.getElementById("winnerFlash");
    const spinBtn = document.getElementById("spinBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const winnerCard = document.getElementById("winnerCard");
    const winnerName = document.getElementById("winnerName");
    const countValue = document.getElementById("countValue");
    const statusValue = document.getElementById("statusValue");
    const confettiLayer = document.getElementById("confettiLayer");

    let currentNames = [];
    let currentRotation = 0;
    let displayedRotation = 0;
    let spinTimeout = null;
    let confettiTimeout = null;
    let celebrationTimeout = null;
    let spinning = false;
    let animationFrameId = null;
    let lastTickIndex = null;
    let flagAnimation = null;
    let flagAnimationUntil = 0;
    const STORAGE_KEY = "fortune-wheel:names";
    const SPIN_DURATION = 5800;
    const FLAG_REST_ANGLE = 7;

    const palette = [
      "#ffbe0b",
      "#fb5607",
      "#ff8fab",
      "#90be6d",
      "#43aa8b",
      "#4d96ff",
      "#b388eb",
      "#ffd166",
      "#f28482",
      "#84a59d"
    ];

    function parseNames(value) {
      return value
        .split(/\n|,/g)
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function saveNames(value) {
      try {
        localStorage.setItem(STORAGE_KEY, value);
      } catch (error) {
        console.warn("Не удалось сохранить список в localStorage", error);
      }
    }

    function loadNames() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        console.warn("Не удалось прочитать список из localStorage", error);
        return null;
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function clearCelebration() {
      winnerFlash.classList.remove("is-visible");
      winnerFlash.style.background = "";
      winnerCard.classList.remove("is-celebrating");
      confettiLayer.innerHTML = "";
      clearTimeout(confettiTimeout);
      clearTimeout(celebrationTimeout);
    }

    function randomFloat() {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] / 4294967296;
      }
      return Math.random();
    }

    function getWinnerIndex(rotation, count) {
      const step = 360 / count;
      const normalized = ((rotation % 360) + 360) % 360;
      const pointerAngle = (360 - normalized) % 360;
      return Math.floor(pointerAngle / step) % count;
    }

    function showWinnerFlash(index, count) {
      const step = 360 / count;
      const start = index * step;
      const end = start + step;

      winnerFlash.style.background = `
        conic-gradient(
          from 0deg,
          rgba(255,255,255,0) 0deg ${start}deg,
          rgba(255, 247, 170, 0.92) ${start}deg,
          rgba(255, 193, 7, 0.58) ${(start + end) / 2}deg,
          rgba(255,255,255,0.92) ${end}deg,
          rgba(255,255,255,0) ${end}deg 360deg
        )
      `;
      winnerFlash.classList.add("is-visible");
    }

    function burstConfetti() {
      confettiLayer.innerHTML = "";
      const colors = ["#ffbe0b", "#fb5607", "#ff006e", "#43aa8b", "#4d96ff", "#fff4b5"];

      for (let i = 0; i < 42; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${6 + randomFloat() * 88}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = `${1800 + randomFloat() * 1200}ms`;
        piece.style.animationDelay = `${randomFloat() * 180}ms`;
        piece.style.setProperty("--drift-x", `${-90 + randomFloat() * 180}px`);
        piece.style.setProperty("--spin-turn", `${180 + randomFloat() * 720}deg`);
        confettiLayer.appendChild(piece);
      }

      confettiTimeout = setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 3200);
    }

    function celebrateWinner(index, winner) {
      clearCelebration();
      showWinnerFlash(index, currentNames.length);
      winnerCard.classList.add("is-celebrating");
      burstConfetti();

      celebrationTimeout = setTimeout(() => {
        winnerFlash.classList.remove("is-visible");
        winnerCard.classList.remove("is-celebrating");
      }, 1600);
    }

    function triggerPointerTick() {
      if (flagAnimation) {
        flagAnimation.cancel();
      }

      flagAnimationUntil = performance.now() + 210;

      flagAnimation = pointerFlag.animate(
        [
          { transform: `rotate(${FLAG_REST_ANGLE}deg)` },
          { transform: "rotate(-24deg)", offset: 0.38 },
          { transform: "rotate(14deg)", offset: 0.72 },
          { transform: `rotate(${FLAG_REST_ANGLE}deg)` }
        ],
        {
          duration: 210,
          easing: "cubic-bezier(0.2, 0.9, 0.28, 1)"
        }
      );
    }

    function stopSpinAnimation(resetFlag = false) {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (flagAnimation) {
        const computedTransform = getComputedStyle(pointerFlag).transform;
        flagAnimation.cancel();
        flagAnimation = null;
        if (!resetFlag && computedTransform && computedTransform !== "none") {
          pointerFlag.style.transform = computedTransform;
        }
      }
      if (resetFlag) {
        pointerFlag.style.transform = `rotate(${FLAG_REST_ANGLE}deg)`;
      }
      lastTickIndex = null;
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function getTickIndex(rotation, count) {
      if (count < 1) {
        return 0;
      }
      const step = 360 / count;
      const normalized = ((rotation % 360) + 360) % 360;
      return Math.floor(normalized / step);
    }

    function updatePointerDrag(rotation, count, now) {
      if (count < 1 || now < flagAnimationUntil) {
        return;
      }

      const step = 360 / count;
      const normalized = ((rotation % 360) + 360) % 360;
      const phase = (normalized % step) / step;
      const dragStart = 0.82;

      if (phase < dragStart) {
        pointerFlag.style.transform = `rotate(${FLAG_REST_ANGLE}deg)`;
        return;
      }

      const local = (phase - dragStart) / (1 - dragStart);
      const draggedAngle = FLAG_REST_ANGLE + local * -18;
      pointerFlag.style.transform = `rotate(${draggedAngle}deg)`;
    }

    function animateSpin(fromRotation, toRotation, count) {
      stopSpinAnimation(true);
      const startedAt = performance.now();
      lastTickIndex = getTickIndex(fromRotation, count);

      function frame(now) {
        const progress = Math.min((now - startedAt) / SPIN_DURATION, 1);
        const eased = easeOutCubic(progress);
        displayedRotation = fromRotation + (toRotation - fromRotation) * eased;
        rotor.style.transform = `rotate(${displayedRotation}deg)`;
        updatePointerDrag(displayedRotation, count, now);

        const tickIndex = getTickIndex(displayedRotation, count);
        if (tickIndex !== lastTickIndex) {
          triggerPointerTick();
          lastTickIndex = tickIndex;
        }

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(frame);
          return;
        }

        displayedRotation = toRotation;
        rotor.style.transform = `rotate(${toRotation}deg)`;
        animationFrameId = null;
      }

      animationFrameId = requestAnimationFrame(frame);
    }

    function renderWheel() {
      currentNames = parseNames(textarea.value);
      wheel.innerHTML = "";
      pegRing.innerHTML = "";

      const count = currentNames.length;
      countValue.textContent = count;

      if (count < 2) {
        clearCelebration();
        wheel.style.background = "radial-gradient(circle at 30% 30%, #fff5d7, #ffd7a1)";
        rotor.style.transform = `rotate(${currentRotation}deg)`;
        winnerName.textContent = "Нужно минимум 2 значения";
        statusValue.textContent = "ожидание";
        return;
      }

      const step = 360 / count;
      const gradientParts = currentNames.map((_, index) => {
        const start = index * step;
        const end = start + step;
        return `${palette[index % palette.length]} ${start}deg ${end}deg`;
      });

      wheel.style.background = `conic-gradient(${gradientParts.join(", ")})`;

      currentNames.forEach((_, index) => {
        const peg = document.createElement("div");
        peg.className = "peg";
        const angle = index * step - 90;
        peg.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-276px)`;
        pegRing.appendChild(peg);
      });

      currentNames.forEach((name, index) => {
        const label = document.createElement("div");
        label.className = "slice-label";
        label.textContent = name;

        const angle = index * step + step / 2 - 90;
        label.style.transform = `rotate(${angle}deg) translate(18px, -50%)`;
        wheel.appendChild(label);
      });

      if (!spinning) {
        rotor.style.transform = `rotate(${currentRotation}deg)`;
        winnerName.textContent = "Нажми «Крутить колесо»";
        statusValue.textContent = "готово";
      }
    }

    function getWinner(rotation, names) {
      return names[getWinnerIndex(rotation, names.length)];
    }

    function spinWheel() {
      const names = parseNames(textarea.value);
      if (names.length < 2 || spinning) {
        renderWheel();
        return;
      }

      spinning = true;
      currentNames = names;
      clearCelebration();
      statusValue.textContent = "крутится";
      winnerName.textContent = "Выбираем...";
      spinBtn.disabled = true;
      shuffleBtn.disabled = true;

      const extraTurns = 6 + Math.floor(randomFloat() * 5);
      const randomOffset = randomFloat() * 360;
      const startRotation = currentRotation;
      currentRotation += extraTurns * 360 + randomOffset;

      animateSpin(startRotation, currentRotation, currentNames.length);

      clearTimeout(spinTimeout);
      spinTimeout = setTimeout(() => {
        const winnerIndex = getWinnerIndex(currentRotation, currentNames.length);
        const winner = getWinner(currentRotation, currentNames);
        winnerName.textContent = winner;
        celebrateWinner(winnerIndex, winner);
        statusValue.textContent = "остановлено";
        spinning = false;
        spinBtn.disabled = false;
        shuffleBtn.disabled = false;
        stopSpinAnimation();
      }, SPIN_DURATION + 100);
    }

    textarea.addEventListener("input", () => {
      saveNames(textarea.value);
      renderWheel();
    });
    spinBtn.addEventListener("click", spinWheel);
    shuffleBtn.addEventListener("click", () => {
      const names = parseNames(textarea.value);
      textarea.value = shuffle(names).join("\n");
      saveNames(textarea.value);
      renderWheel();
    });

    const savedNames = loadNames();
    if (savedNames && savedNames.trim()) {
      textarea.value = savedNames;
    } else {
      saveNames(textarea.value);
    }

    renderWheel();
  </script>
</body>
</html>
